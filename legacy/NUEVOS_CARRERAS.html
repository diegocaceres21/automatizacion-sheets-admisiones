  <script>
//////TRASPASO

  var today = new Date();
  var timezoneOffset = today.getTimezoneOffset();
  today.setMinutes(today.getMinutes() - timezoneOffset);
  
  document.getElementById('fechaInscripcion').valueAsDate = today;

  // 'YYYY-MM-DD' (input date) -> 'DD/MM/YYYY'. Reemplaza formatDate, que sumaba 1 al dia y fallaba a fin de mes.
  function formatFechaInput(iso) { var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function formatDate(date) {
  var day = date.getDate() + 1;
  var month = date.getMonth() + 1;
  var year = date.getFullYear();

  // Pad with zero if needed
  day = day < 10 ? '0' + day : day;
  month = month < 10 ? '0' + month : month;

  return day + '/' + month + '/' + year;
}


function toggleUniversidadVisibility() {
    var tipoEstudianteValue = document.getElementById('tipoEstudiante').value;
    var universidadInput = document.getElementById('divUniversidad');
    universidadInput.style.display = tipoEstudianteValue === 'TRASPASO' ? 'block' : 'none';
  }
  document.getElementById('tipoEstudiante').addEventListener('change', toggleUniversidadVisibility);

    // ===== PROMOCIÓN TEMPORAL: BORRAR ESTA FUNCIÓN CUANDO TERMINE EL EVENTO =====
    function actualizarVisibilidadPromo() {
      var carreraValue = document.getElementById('carrera').value;
      var divPromo = document.getElementById('divPromoPreUCB');
      var selectPromo = document.getElementById('grupoPreUCB');

      // Limpiar opciones actuales, dejando solo "NO INCLUIR"
      selectPromo.innerHTML = '<option value="">NO INCLUIR</option>';

      if (carreraValue === 'MEDICINA') {
        // Medicina no participa en la promoción
        divPromo.style.display = 'none';
      }
      else if (carreraValue === 'ODONTOLOGIA') {
        divPromo.style.display = 'block';
        selectPromo.innerHTML += '<option value="PRE UCB MED 1">PRE UCB CIENCIAS DE LA SALUD - GRUPO 1</option>';
        selectPromo.innerHTML += '<option value="PRE UCB MED 2">PRE UCB CIENCIAS DE LA SALUD - GRUPO 2</option>';
        selectPromo.innerHTML += '<option value="PRE UCB MED 3">PRE UCB CIENCIAS DE LA SALUD - GRUPO 3</option>';
      }
      else {
        divPromo.style.display = 'block';
        selectPromo.innerHTML += '<option value="PRE UCB GENERAL">PRE UCB GENERAL - GRUPO 1</option>';
        selectPromo.innerHTML += '<option value="PRE UCB GENERAL 2">PRE UCB GENERAL - GRUPO 2</option>';
      }
    }
    // ===== FIN =====
    ///TESTS ACADEMICOS
  function actualizarMatematicas() {
    var carreras = ["ADMINISTRACION DE EMPRESAS", "CONTADURIA PUBLICA", "INGENIERIA COMERCIAL","INGENIERIA EN COMERCIO Y FINANZAS INTERNACIONALES", "INGENIERIA EMPRESARIAL", "INGENIERIA FINANCIERA","INGENIERIA QUIMICA", "INGENIERIA AMBIENTAL", "INGENIERIA INDUSTRIAL", "INGENIERIA DE SISTEMAS", "INGENIERIA CIVIL", "INGENIERIA DE TELECOMUNICACIONES", "INGENIERIA MECATRONICA"];

    var carreraValue = document.getElementById('carrera').value;
    var matematicasDropdown = document.getElementById('matematicas');

    // Update the value of "firma" based on the selected value of "etapa"
    matematicasDropdown.value = carreras.includes(carreraValue) ? 'PENDIENTE' : 'NO CORRESPONDE';
  }
  function actualizarFisica() {
    var carreras = ["INGENIERIA QUIMICA", "INGENIERIA AMBIENTAL", "INGENIERIA INDUSTRIAL", "INGENIERIA DE SISTEMAS", "INGENIERIA CIVIL", "INGENIERIA DE TELECOMUNICACIONES", "INGENIERIA MECATRONICA"];

    var carreraValue = document.getElementById('carrera').value;
    var fisicaDropdown = document.getElementById('fisica');

    // Update the value of "firma" based on the selected value of "etapa"
    fisicaDropdown.value = carreras.includes(carreraValue) ? 'PENDIENTE' : 'NO CORRESPONDE';
  }
  function actualizarQuimica() {
    var carreras = ["INGENIERIA QUIMICA", "INGENIERIA AMBIENTAL", "INGENIERIA INDUSTRIAL"];

    var carreraValue = document.getElementById('carrera').value;
    var quimicaDropdown = document.getElementById('quimica');

    // Update the value of "firma" based on the selected value of "etapa"
    quimicaDropdown.value = carreras.includes(carreraValue) ? 'PENDIENTE' : 'NO CORRESPONDE';
  }

  window.addEventListener('load', function() {
    actualizarMatematicas();
    actualizarFisica();
    actualizarQuimica();
    actualizarVisibilidadPromo(); //TEMPORAL CATO HOLIDAY
  });
  document.getElementById('carrera').addEventListener('change', actualizarMatematicas);
  document.getElementById('carrera').addEventListener('change', actualizarFisica);
  document.getElementById('carrera').addEventListener('change', actualizarQuimica);
